[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hqe"
version = "1.0.0"
description = "Hermes Query Engine — Unified semantic search across agent memory (Cortex, Codex, Graph)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Krisztián Majoros", email = "kriszmac4@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/kriszmac4/hqe"
Repository = "https://github.com/kriszmac4/hqe"
Issues = "https://github.com/kriszmac4/hqe/issues"

[project.scripts]
hqe = "hqe.cli:main"

[tool.setuptools.packages.find]
include = ["hqe*"]
