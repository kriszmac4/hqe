<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5eead4"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Glow orb -->
  <circle cx="640" cy="200" r="180" fill="url(#glow)" filter="url(#bigGlow)"/>

  <!-- Central magnifying glass icon -->
  <g filter="url(#softGlow)">
    <!-- Lens -->
    <circle cx="640" cy="170" r="45" fill="none" stroke="url(#accent1)" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="640" cy="170" r="25" fill="url(#accent1)" fill-opacity="0.08" stroke="url(#accent1)" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Handle -->
    <line x1="675" y1="205" x2="700" y2="230" stroke="url(#accent1)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.7"/>
    <!-- Search beam -->
    <path d="M620,145 L580,100" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M660,145 L700,100" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M640,130 L640,90" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Data flow lines: three sources → center -->
  <path d="M220,380 C340,340 440,290 610,195"
        fill="none" stroke="url(#accent2)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M1060,380 C940,340 840,290 670,195"
        fill="none" stroke="url(#accent1)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" repeatCount="indefinite"/>
  </path>
  <path d="M640,440 C640,360 640,300 640,220"
        fill="none" stroke="url(#accent3)" stroke-width="2" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Animated dots on paths -->
  <circle r="4" fill="url(#accent2)" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M220,380 C340,340 440,290 610,195"/>
  </circle>
  <circle r="4" fill="url(#accent1)" opacity="0.8">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M1060,380 C940,340 840,290 670,195"/>
  </circle>
  <circle r="4" fill="url(#accent3)" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" path="M640,440 C640,360 640,300 640,220"/>
  </circle>

  <!-- Source nodes -->
  <!-- Cortex -->
  <rect x="155" y="365" width="130" height="30" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.5"/>
  <text x="220" y="384" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">CORTEX</text>
  <text x="220" y="410" font-family="monospace" font-size="9" fill="#5eead4" fill-opacity="0.6" text-anchor="middle">Session Store</text>

  <!-- Codex -->
  <rect x="995" y="365" width="130" height="30" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="1060" y="384" font-family="monospace" font-size="12" fill="#06b6d4" text-anchor="middle">CODEX</text>
  <text x="1060" y="410" font-family="monospace" font-size="9" fill="#5eead4" fill-opacity="0.6" text-anchor="middle">Knowledge Base</text>

  <!-- Graph -->
  <rect x="580" y="435" width="120" height="30" rx="6" fill="#0891b2" fill-opacity="0.12" stroke="#5eead4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="640" y="454" font-family="monospace" font-size="12" fill="#5eead4" text-anchor="middle">GRAPH</text>
  <text x="640" y="480" font-family="monospace" font-size="9" fill="#5eead4" fill-opacity="0.6" text-anchor="middle">Entity Network</text>

  <!-- Title -->
  <text x="640" y="555" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="700" fill="url(#accent1)" text-anchor="middle"
        filter="url(#softGlow)">HQE</text>
  <text x="640" y="580" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="300" fill="#22d3ee" text-anchor="middle" letter-spacing="2">HERMES QUERY ENGINE</text>
  <text x="640" y="600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="300" fill="#5eead4" fill-opacity="0.6" text-anchor="middle">Unified Semantic Search Across Agent Memory</text>

  <!-- Version badge -->
  <rect x="595" y="510" width="90" height="22" rx="11" fill="#0891b2" fill-opacity="0.3"
        stroke="#06b6d4" stroke-width="0.5"/>
  <text x="640" y="525" font-family="monospace" font-size="10" fill="#22d3ee" text-anchor="middle">v1.0.0</text>

  <!-- Bottom bar -->
  <line x1="200" y1="625" x2="1080" y2="625" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <text x="640" y="635" font-family="monospace" font-size="10" fill="#505060" text-anchor="middle">hqe · unified search · open source</text>
</svg>
